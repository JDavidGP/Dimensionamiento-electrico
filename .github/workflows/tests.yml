name: Pruebas

# Corre la regresión completa (lógica pura + UI con Playwright) en
# cada push/PR — usuario, 2026-11-22, "hacer más robusta la
# seguridad": antes esto solo corría manualmente desde un scratchpad
# de sesión, nunca quedaba verificado en el repo. Ver tests/run-all.mjs
# y tests/known-failures.json para el criterio de qué cuenta como
# falla nueva vs. deuda ya conocida.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias (bug conocido de npm, "Exit handler never called!" — reproducido 7/7 veces con `npm ci` en este runner, con timing ~70s consistente en cada intento; `npm install` con timeouts de red más largos evita el mismo camino interno de npm que lo dispara, ver https://github.com/npm/cli/issues)
        run: |
          npm config set fetch-timeout 300000
          npm config set fetch-retry-maxtimeout 120000
          for intento in 1 2 3; do
            npm install --no-audit --no-fund && exit 0
            echo "npm install falló (intento $intento/3), reintentando..."
            sleep 5
          done
          echo "npm install falló los 3 intentos."
          exit 1

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run type-check

      - run: npm run build

      - name: Correr toda la regresión
        run: npm test
        env:
          BASE_URL: http://localhost:4343
