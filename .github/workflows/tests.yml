name: Pruebas

# Corre la regresión completa (lógica pura + UI con Playwright) en
# cada push/PR — usuario, 2026-11-22, "hacer más robusta la
# seguridad": antes esto solo corría manualmente desde un scratchpad
# de sesión, nunca quedaba verificado en el repo. Ver tests/run-all.mjs
# y tests/known-failures.json para el criterio de qué cuenta como
# falla nueva vs. deuda ya conocida.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Bug de npm, "Exit handler never called!" — reproducido 10/10 veces
      # en este runner (con `npm ci`, con `npm install`, con reintentos,
      # con timeouts más largos — ver el historial de commits de este
      # archivo). Siempre se cuelga ~70-110s en el mismo punto (justo
      # tras resolver workbox-build/glob, el árbol más grande de la
      # dependencia nueva vite-plugin-pwa) y después revienta — no es
      # de red ni transitorio. pnpm usa un instalador completamente
      # distinto (nunca tuvo este bug, que es específico de npm) —
      # probamos esto en vez de seguir ajustando npm.
      - name: Habilitar pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Instalar dependencias con pnpm
        run: pnpm install --no-frozen-lockfile

      - name: Instalar Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run type-check

      - run: pnpm run build

      - name: Correr toda la regresión
        run: pnpm test
        env:
          BASE_URL: http://localhost:4343
